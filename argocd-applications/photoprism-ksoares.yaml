apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: photoprism-ksoares
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=photoprism/photoprism:latest
    argocd-image-updater.argoproj.io/app.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  destination:
    namespace: igpu
    server: https://kubernetes.default.svc
  project: vinicima-prod
  source:
    path: kustomize/igpu-stack/photoprism-ksoares
    repoURL: git@github.com:vinicimatecnologia/k3s-homelab.git
    targetRevision: main
  syncPolicy:
    automated: {}

