apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blockbusterr
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=ghcr.io/mahcks/blockbusterr:latest
    argocd-image-updater.argoproj.io/app.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  destination:
    namespace: arr
    server: https://kubernetes.default.svc
  project: vinicima-prod
  source:
    path: kustomize/arr-stack/blockbusterr
    repoURL: git@github.com:vinicimatecnologia/k3s-homelab.git
    targetRevision: main
  syncPolicy:
    automated: {}

