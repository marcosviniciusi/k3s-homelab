apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: libretranslate
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=libretranslate/libretranslate
    argocd-image-updater.argoproj.io/app.update-strategy: semver
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  destination:
    namespace: arr
    server: https://kubernetes.default.svc
  project: vinicima-prod
  source:
    path: kustomize/arr-stack/libretranslate
    repoURL: git@github.com:vinicimatecnologia/k3s-homelab.git
    targetRevision: main
  syncPolicy:
    automated: {}

