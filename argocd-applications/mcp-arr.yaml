apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp-arr
  namespace: argocd
spec:
  destination:
    namespace: mcp-arr
    server: https://kubernetes.default.svc
  project: vinicima-prod
  source:
    path: kustomize/mcp-arr
    repoURL: git@github.com:vinicimatecnologia/k3s-homelab.git
    targetRevision: main
  syncPolicy:
    automated: {}
