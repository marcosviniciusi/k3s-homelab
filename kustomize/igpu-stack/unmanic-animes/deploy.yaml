kind: Deployment
apiVersion: apps/v1
metadata:
  name: unmanic-animes
  labels:
    app: unmanic-animes
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: unmanic-animes
  template:
    metadata:
      labels:
        app: unmanic-animes
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ellie
      containers:
      - name: unmanic-animes
        image: registry.vinicima.com/unmanic:latest
        imagePullPolicy: Always
        ports:
        - name: unmanic-animes
          containerPort: 8888
        env:
        - name: PUID
          value: "10000"
        - name: PGID
          value: "10000"
        - name: TZ
          value: "America/Sao_Paulo"
        resources:
          limits:
            gpu.intel.com/i915: "5"
        volumeMounts:
        - name: unmanic-animes
          mountPath: /config
        - name: nfs-animes
          mountPath: /data/videos/animes
        - name: nfs-animes-movies
          mountPath: /data/videos/animes-movies
        - name: unmanic-animes-transcode
          mountPath: /tmp/unmanic
      volumes:
      - name: unmanic-animes
        persistentVolumeClaim:
          claimName: unmanic-animes
      - name: nfs-animes-movies
        nfs:
          server: 192.168.253.250
          path: /export/data/videos/animes-movies
      - name: nfs-animes
        nfs:
          server: 192.168.253.250
          path: /export/data/videos/animes-series
      - name: unmanic-animes-transcode
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi