apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: photo-ksoares
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ksoares-k8s.vinicima.com`) || Host(`ksoares.vinicima.com`)
      kind: Rule
      services:
        - name: photo-ksoares
          port: 2342
      middlewares:
        - name: body-size-50m
          namespace: traefik
  tls:
    secretName: vinicima.com-tls