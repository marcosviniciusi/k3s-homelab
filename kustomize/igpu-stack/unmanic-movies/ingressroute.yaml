apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unmanic-movies
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`unmanic-movies-k8s.vinicima.com`) || Host(`unmanic-movies.vinicima.com`)
      kind: Rule
      services:
        - name: unmanic-movies
          port: 8888
      middlewares:
        - name: body-size-50m
          namespace: traefik
  tls:
    secretName: vinicima.com-tls