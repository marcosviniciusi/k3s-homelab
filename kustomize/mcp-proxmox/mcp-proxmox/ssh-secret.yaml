apiVersion: v1
kind: Secret
metadata:
  name: mcp-proxmox-ssh-keys
  namespace: mcp-proxmox
  labels:
    app: mcp-proxmox
type: Opaque
# Para criar este Secret com sua chave SSH:
#
#   kubectl create secret generic mcp-proxmox-ssh-keys \
#     --namespace mcp-proxmox \
#     --from-file=id_rsa=/path/to/your/private_key \
#     --from-file=id_rsa.pub=/path/to/your/public_key
#
# Ou encode em base64:
#   cat ~/.ssh/id_rsa | base64 -w0
data: {}
  # id_rsa: <base64-encoded-private-key>
  # id_rsa.pub: <base64-encoded-public-key>
