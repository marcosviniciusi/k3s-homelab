apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keel
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`keel.vinicima.com`) || Host(`keel-k8s.vinicima.com`)
      kind: Rule
      services:
        - name: keel
          port: keel
  tls:
    secretName: vinicima-com-tls