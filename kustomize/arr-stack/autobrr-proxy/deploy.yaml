# k8s/autobrr-proxy/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrr-proxy
  labels:
    app: autobrr-proxy
    app.kubernetes.io/name: autobrr-proxy
    app.kubernetes.io/component: proxy
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 0
  replicas: 0
  selector:
    matchLabels:
      app: autobrr-proxy
  template:
    metadata:
      labels:
        app: autobrr-proxy
    spec:
      containers:
      - name: autobrr-proxy
        image: marcosviniciusi/autobrr-proxy-br:1.5.0
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8888
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: "DEBUG"  # ou "INFO" para menos logs
        # Carrega TODAS as env vars do ConfigMap e Secret
        envFrom:
        - secretRef:
            name: autobrr-proxy-secrets
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      restartPolicy: Always