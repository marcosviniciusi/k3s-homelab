apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracearr
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: tracearr
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: tracearr
  template:
    metadata:
      labels:
        app: tracearr
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - eloy
                - joel
                - ellie
      containers:
      - name: tracearr
        image: ghcr.io/connorgallopo/tracearr:latest
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        envFrom:
        - secretRef:
            name: tracearr-secrets