apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whisparr
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`videosx-k8s.vinicima.com`)
      kind: Rule
      services:
        - name: whisparr
          port: 6969
      middlewares:
        - name: body-size-50m
          namespace: traefik
  tls:
    secretName: vinicima-com-tls