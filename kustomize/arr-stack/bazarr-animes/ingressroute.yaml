apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bazarr-animes
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`animes-legendas-k8s.vinicima.com`) || Host(`animes-legendas.vinicima.com`)
      kind: Rule
      services:
        - name: bazarr-animes
          port: 6767
      middlewares:
        - name: body-size-50m
          namespace: traefik
  tls:
    secretName: vinicima-com-tls