kind: Deployment
apiVersion: apps/v1
metadata:
  name: suggestarr
  labels:
    app: suggestarr
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: suggestarr
  template:
    metadata:
      labels:
        app: suggestarr
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
        instrumentation.opentelemetry.io/otel-python-platform: "glibc"
        sidecar.opentelemetry.io/inject: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - eloy
                - joel
                - ellie
      containers:
      - name: suggestarr
        image: ciuse99/suggestarr:v2.4.3
        resources:
            limits:
              memory: 2Gi
              cpu: 2000m
            requests:
              memory: 512Mi
              cpu: 500m  
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
        ports:
        - name: suggestarr
          containerPort: 5000
        env:
        - name: TZ
          value: "America/Sao_Paulo"
        - name: SUGGESTARR_PORT
          value: "5000"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=sugestarr,deployment.environment=PRD,stack.app=python"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_traceidratio"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "1"
        - name: OTEL_INSTRUMENTATION_OKHTTP_ENABLED
          value: "FALSE"
        volumeMounts:
        - name: suggestarr
          mountPath: /app/config/config_files
      volumes:
      - name: suggestarr
        persistentVolumeClaim:
          claimName: suggestarr

