apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrr
  labels:
    app: autobrr
    app.kubernetes.io/name: autobrr
    app.kubernetes.io/component: automation
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 0
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autobrr
  template:
    metadata:
      labels:
        app: autobrr
    spec:
      securityContext:
        fsGroup: 10000
        runAsUser: 10000
        runAsGroup: 10000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - aloy
                - joel
                - ellie
      containers:
      - name: autobrr
        image: ghcr.io/autobrr/autobrr:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 7474
          protocol: TCP
        env:
        - name: TZ
          value: "America/Sao_Paulo"
        - name: PUID
          value: "10000"
        - name: PGID
          value: "10000"
        envFrom:
        - secretRef:
            name: autobrr-secrets
        volumeMounts:
        - name: config
          mountPath: /config
        - name: custom-definitions
          mountPath: /config/definitions
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "2048Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/healthz/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/healthz/liveness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: autobrr-config
      - name: custom-definitions
        configMap:
          name: autobrr-definition
      restartPolicy: Always