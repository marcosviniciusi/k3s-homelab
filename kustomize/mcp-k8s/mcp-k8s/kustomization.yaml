apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mcp-k8s

commonLabels:
  app.kubernetes.io/name: mcp-k8s
  app.kubernetes.io/part-of: mcp-k8s

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - sealedsecret-kubeconfig.yaml
  - sealedsecret-auth-tokens.yaml
