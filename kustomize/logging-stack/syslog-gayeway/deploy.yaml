apiVersion: apps/v1
kind: Deployment
metadata:
  name: syslog-gateway
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syslog-gateway
  template:
    metadata:
      labels:
        app: syslog-gateway
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.140.1
        command:
          - "/otelcol-contrib"
          - "--config=/etc/otelcol-contrib/config.yaml"
          - "--feature-gates=transform.flatten.logs"
        ports:
        - containerPort: 514
          protocol: TCP
        - containerPort: 514
          protocol: UDP
        - containerPort: 13133
          protocol: TCP
        - containerPort: 8888
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol-contrib/config.yaml
          subPath: config.yaml
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: syslog-gateway-config