apiVersion: v1
kind: ConfigMap
metadata:
  name: syslog-gateway-config
  namespace: syslog-gateway
data:
  config.yaml: |
    receivers:
      syslog:
        tcp:
          listen_address: "0.0.0.0:514"
        protocol: rfc5424

    processors:
      # Copia atributos do syslog
      attributes:
        actions:
          - key: syslog.appname
            from_attribute: appname
            action: upsert
          - key: syslog.facility
            from_attribute: facility
            action: upsert

      # Transform com flatten_data para copiar log attributes para resource
      transform:
        error_mode: ignore
        flatten_data: true
        log_statements:
          - set(resource.attributes["service.name"], log.attributes["appname"]) where log.attributes["appname"] != nil
          - set(resource.attributes["host.name"], log.attributes["hostname"]) where log.attributes["hostname"] != nil
          - set(resource.attributes["log.source"], "syslog-gateway")
          - set(resource.attributes["deployment.environment"], "PRD")
          # Substitui o body raw pelo campo message já parseado (sem header RFC5424)
          - set(log.body, log.attributes["message"]) where log.attributes["message"] != nil

      # Batch para performance
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlp:
        endpoint: "signoz-otel-collector.signoz-observability.svc.cluster.local:4317"
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 10
          queue_size: 5000
        timeout: 30s

      debug:
        verbosity: normal
        sampling_initial: 5
        sampling_thereafter: 200

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    service:
      telemetry:
        logs:
          level: info
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [syslog]
          processors: [attributes, transform, batch]
          exporters: [otlp, debug]