apiVersion: v1
kind: PersistentVolume
metadata:
  name: clickhouse-nardine-pv
spec:
  capacity:
    storage: 250Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nardine
  hostPath:
    path: /k8s/clickhouse
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-nardine-pvc
  namespace: signoz-observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: clickhouse-nardine-pv
  resources:
    requests:
      storage: 250Gi