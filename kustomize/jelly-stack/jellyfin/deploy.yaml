kind: Deployment
apiVersion: apps/v1
metadata:
  name: jellyfin
  labels:
    app: jellyfin
  annotations:
    reloader.stakater.com/auto: "true" 
spec:
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
      annotations:
        instrumentation.opentelemetry.io/inject-dotnet: "true"
        sidecar.opentelemetry.io/inject: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - aloy
      containers:
      - name: jellyfin
        image: ghcr.io/hotio/jellyfin:latest
        ports:
        - name: jellyfin
          containerPort: 8096
        env:
        - name: PUID
          value: "10000"
        - name: PGID
          value: "10000"
        - name: TZ
          value: "America/Sao_Paulo"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=jellyfin,deployment.environment=PRD,stack.app=DOTNET"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_TRACES_SAMPLER
          value: "parentbased_traceidratio"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "1"
        - name: OTEL_INSTRUMENTATION_OKHTTP_ENABLED
          value: "FALSE"
        resources:
          limits:
            gpu.intel.com/i915: "2"
        #livenessProbe:
        #  httpGet:
        #    path: /
        #    port: 8096
        #  initialDelaySeconds: 30
        #  periodSeconds: 60
        #  failureThreshold: 3
        #readinessProbe:
        #  httpGet:
        #    path: /
        #    port: 8096
        #  initialDelaySeconds: 180
        #  periodSeconds: 30
        #  failureThreshold: 3
        volumeMounts:
        - name: jelly-data
          mountPath: /config
        - name: jellyfin-metadata
          mountPath: /config/data/metadata/
        - name: jellyfin-cache
          mountPath: /config/cache/
        - name: videos
          mountPath: /data/videos/
          readOnly: true
        - name: jellyfin-transcode
          mountPath: /config/cache/transcodes
      volumes:
      - name: jelly-data
        persistentVolumeClaim:
          claimName: jelly-data
      - name: jellyfin-metadata
        nfs:
          server: 192.168.253.250
          path: /export/nfs-server/jellyfin/metadata/
      - name: jellyfin-cache
        nfs:
          server: 192.168.253.250
          path: /export/nfs-server/jellyfin/cache/
      - name: videos
        nfs:
          server: 192.168.253.250
          path: /export/data/videos
      - name: jellyfin-transcode
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi

