apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-signoz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-signoz
  template:
    metadata:
      labels:
        app: mcp-signoz
    spec:
      serviceAccountName: mcp-signoz
      containers:
        - name: mcp-signoz
          image: marcosviniciusi/mcp-signoz:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: mcp-signoz-config
            - secretRef:
                name: mcp-signoz-secret
          volumeMounts:
            - name: rbac-keys
              mountPath: /etc/mcp-signoz/rbac-keys
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: rbac-keys
          secret:
            secretName: mcp-signoz-rbac-keys
