apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  labels:
    app: librechat
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      labels:
        app: librechat
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - aloy
                - joel
                - ellie
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ['sh', '-c', 'chown -R 1000:1000 /app/logs /app/client/public/images /app/uploads']
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: images
          mountPath: /app/client/public/images
        - name: uploads
          mountPath: /app/uploads
      containers:
      - name: librechat
        image: registry.librechat.ai/danny-avila/librechat-dev:latest
        ports:
        - name: http
          containerPort: 3080
          protocol: TCP
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: DOMAIN_CLIENT
          value: "https://chat.vinicima.com"
        - name: DOMAIN_SERVER
          value: "https://chat.vinicima.com"
        - name: ALLOW_REGISTRATION
          value: "true"
        - name: MEILI_HOST
          value: "http://meilisearch.databases.svc.cluster.local:7700"
        - name: RAG_PORT
          value: "8000"
        - name: RAG_API_URL
          value: "http://librechat-rag.tools.svc.cluster.local:8000"
        - name: EMAIL_SERVICE
          value: "gmail"
        - name: EMAIL_HOST
          value: "smtp.gmail.com"
        - name: EMAIL_PORT
          value: "587"
        - name: EMAIL_ENCRYPTION
          value: "starttls"
        - name: EMAIL_FROM_NAME
          value: "LibreChat"
        - name: EMAIL_ALLOW_SELFSIGNED
          value: "false"
        envFrom:
        - secretRef:
            name: librechat-secrets
        volumeMounts:
        - name: config
          mountPath: /app/librechat.yaml
          subPath: librechat.yaml
        - name: images
          mountPath: /app/client/public/images
        - name: uploads
          mountPath: /app/uploads
        - name: logs
          mountPath: /app/logs
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: config
        configMap:
          name: librechat-config
      - name: images
        persistentVolumeClaim:
          claimName: librechat-images
      - name: uploads
        persistentVolumeClaim:
          claimName: librechat-uploads
      - name: logs
        persistentVolumeClaim:
          claimName: librechat-logs
