apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app: searxng
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - aloy
                - joel
                - ellie
      initContainers:
      - name: envsubst-config
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          cp /config-template/limiter.toml /config-rendered/limiter.toml
          sed "s|\${SEARXNG_REDIS_URL}|$SEARXNG_REDIS_URL|g" /config-template/settings.yml > /config-rendered/settings.yml
        envFrom:
        - secretRef:
            name: searxng-secret
        volumeMounts:
        - name: config-template
          mountPath: /config-template
          readOnly: true
        - name: config-rendered
          mountPath: /config-rendered
      containers:
      - name: searxng
        image: searxng/searxng:latest
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SEARXNG_PORT
          value: "8080"
        envFrom:
        - secretRef:
            name: searxng-secret
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 15
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        volumeMounts:
        - name: config-rendered
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
          readOnly: true
        - name: config-rendered
          mountPath: /etc/searxng/limiter.toml
          subPath: limiter.toml
          readOnly: true
      volumes:
      - name: config-template
        configMap:
          name: searxng-config
      - name: config-rendered
        emptyDir: {}
