apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lh-k8s.vinicima.com`) || Host(`lh.vinicima.com`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
      middlewares:
        - name: longhorn-auth
        - name: body-size-10g
  tls:
    secretName: vinicima-com-tls