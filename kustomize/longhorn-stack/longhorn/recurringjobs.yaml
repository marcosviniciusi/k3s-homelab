apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: full-backup
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: "0 8 * * 6"
  groups:
    - longhorn
  labels: {}
  name: full-backup
  parameters: {}
  retain: 1
  task: backup-force-create
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: delete-snapshot
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: "0 8 * * 4"
  groups:
    - longhorn
  labels: {}
  name: delete-snapshot
  parameters: {}
  retain: 0
  task: snapshot-delete
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: trim-filesystem
  namespace: longhorn-system
spec:
  concurrency: 1
  cron: "0 8 * * 1"
  groups:
    - longhorn
  labels: {}
  name: trim-filesystem
  parameters: {}
  retain: 0
  task: filesystem-trim
