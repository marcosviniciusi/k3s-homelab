################################################################
# HTTP Middlewares
################################################################
[http.middlewares]

  ################################################################
  # Security Headers - Mozilla Observatory A+ Rating
  ################################################################
  [http.middlewares.security-headers.headers]
    sslRedirect = true
    stsSeconds = 63072000
    stsIncludeSubdomains = true
    stsPreload = true
    forceSTSHeader = true
    frameDeny = false
    customFrameOptionsValue = "SAMEORIGIN"
    contentTypeNosniff = true
    browserXssFilter = true
    referrerPolicy = "strict-origin-when-cross-origin"
    permissionsPolicy = "geolocation=(), microphone=(), camera=()"

    [http.middlewares.security-headers.headers.customResponseHeaders]
      X-Robots-Tag = "noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex"

  ################################################################
  # Media Headers - Jellyfin/Emby/Overseerr com CSP
  ################################################################
  [http.middlewares.media-headers.headers]
    sslRedirect = true
    stsSeconds = 63072000
    stsIncludeSubdomains = true
    stsPreload = true
    forceSTSHeader = true
    contentTypeNosniff = true
    browserXssFilter = true

    [http.middlewares.media-headers.headers.customResponseHeaders]
      Content-Security-Policy = "default-src 'none'; font-src 'self'; connect-src 'self' wss: ws: https://mb3admin.com; media-src 'self' blob: data:; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; worker-src 'self' blob:; script-src 'self' https://www.gstatic.com https://static.cloudflareinsights.com; img-src data: https: http:; style-src 'unsafe-inline' 'self'"
      X-Frame-Options = "SAMEORIGIN"
      Referrer-Policy = "no-referrer,same-origin,strict-origin,strict-origin-when-cross-origin"
      X-XSS-Protection = "1; mode=block"
      X-Content-Type-Options = "nosniff"

  ################################################################
  # IP Whitelists
  ################################################################

  # Nível 1: REDE LOCAL RESTRITO (VPN/Servers)
  [http.middlewares.restrict-local.ipAllowList]
    sourceRange = [
      "192.168.253.2/32",
      "192.168.253.3/32",
      "192.168.253.4/32",
      "192.168.253.5/32",
      "192.168.254.0/26",
      "192.168.250.0/28",
      "192.168.249.0/24",
      "192.168.248.250/32",
      "fd00:0000:0000:0200::/64",
      "fd00:0:0:0206::/64"
    ]

  # Nível 2: Local Sem Restrição (Toda rede local)
  [http.middlewares.full-local.ipAllowList]
    sourceRange = [
      "192.168.253.0/24",
      "192.168.249.0/24",
      "192.168.250.0/25",
      "192.168.250.128/26",
      "192.168.251.0/24",
      "192.168.252.0/22",
      "192.168.250.224/27",
      "192.168.250.235/32",
      "fd00:0:0:0200::/56",
      "fd00::203:a085:f2ff:fe11:3f10/128"
    ]

  ################################################################
  # Rate Limiting e proteções para serviços públicos
  ################################################################
  [http.middlewares.rate-limit-public.rateLimit]
    average = 100
    burst = 50
    period = "1m"

  # Redirect para imagens ruins do Jellyfin/Emby/Overseerr
  [http.middlewares.block-bad-images.redirectRegex]
    regex = "^/(Images/Remote|Items/RemoteSearch/Image|Items/[^\\.]+/RemoteImages/Download)"
    replacement = "https://i.ytimg.com/vi/avCWDDox1nE/maxresdefault.jpg"
    permanent = false

