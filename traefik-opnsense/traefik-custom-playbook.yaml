---
- name: Configurar Traefik no OPNsense (mínimo essencial)
  hosts: opnsense
  gather_facts: no
  become: yes

  vars:
    traefik_token: ""   # passe via --extra-vars
    traefik_conf: "/usr/local/etc/traefik.yml"
    traefik_user: "traefik"
    traefik_group: "traefik"

  tasks:

    #----------------------------------------------------------
    # Instalar repo mimugmail
    #----------------------------------------------------------
    - name: Instalar arquivo mimugmail.conf
      ansible.builtin.get_url:
        url: "https://www.routerperformance.net/mimugmail.conf"
        dest: "/usr/local/etc/pkg/repos/mimugmail.conf"
        mode: "0644"

    #----------------------------------------------------------
    # Loader - habilitar mac_portacl
    #----------------------------------------------------------
    - name: Garantir 'mac_portacl_load="YES"' no /boot/loader.conf
      ansible.builtin.lineinfile:
        path: /boot/loader.conf
        line: 'mac_portacl_load="YES"'
        state: present
        create: yes

    #----------------------------------------------------------
    # rc.conf - adicionar variáveis
    #----------------------------------------------------------
    - name: Adicionar traefik_env ao /etc/rc.conf
      ansible.builtin.lineinfile:
        path: /etc/rc.conf
        state: present
        insertafter: EOF
        line: 'traefik_env="CF_DNS_API_TOKEN={{ traefik_token }}"'

    - name: Adicionar traefik_conf ao /etc/rc.conf
      ansible.builtin.lineinfile:
        path: /etc/rc.conf
        state: present
        insertafter: EOF
        line: "traefik_conf={{ traefik_conf }}"

    - name: (Opcional) adicionar traefik_user
      ansible.builtin.lineinfile:
        path: /etc/rc.conf
        state: present
        insertafter: EOF
        line: "traefik_user={{ traefik_user }}"

    - name: (Opcional) adicionar traefik_group
      ansible.builtin.lineinfile:
        path: /etc/rc.conf
        state: present
        insertafter: EOF
        line: "traefik_group={{ traefik_group }}"

    #----------------------------------------------------------
    # Ajustes de permissão e estrutura do Traefik
    #----------------------------------------------------------
    - name: Ajustar owner do traefik.yml
      ansible.builtin.file:
        path: "/usr/local/etc/traefik.yml"
        owner: "{{ traefik_user }}"
        group: "{{ traefik_group }}"
        mode: "0644"
        state: file

    - name: Ajustar owner do traefik.toml (se existir)
      ansible.builtin.file:
        path: "/usr/local/etc/traefik.toml"
        owner: "{{ traefik_user }}"
        group: "{{ traefik_group }}"
        mode: "0644"
        state: file
      ignore_errors: true

    - name: Criar diretórios do Traefik
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ traefik_user }}"
        group: "{{ traefik_group }}"
        mode: "0755"
      loop:
        - /var/db/traefik
        - /var/log/traefik

    - name: Criar acme.json com permissão 600
      ansible.builtin.file:
        path: /var/db/traefik/acme.json
        state: touch
        owner: "{{ traefik_user }}"
        group: "{{ traefik_group }}"
        mode: "0600"

    - name: Ajustar recursivamente logs e db
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        recurse: yes
        owner: "{{ traefik_user }}"
        group: "{{ traefik_group }}"
      loop:
        - /var/db/traefik
        - /var/log/traefik
